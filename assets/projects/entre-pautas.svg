<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Entre Pautas</title>
  <desc id="desc">Propostas primeiro. Experiência de afinidade política em versão beta.</desc>
  <rect width="720" height="480" fill="#f6f7f2"/>
  <circle cx="685" cy="440" r="180" fill="#d8ed9c" opacity=".45"/>
  <g font-family="Arial, sans-serif" fill="#172f2a">
    <text x="56" y="90" font-size="32" letter-spacing="-1">entre <tspan font-weight="700">pautas</tspan></text>
    <rect x="259" y="65" width="58" height="28" rx="6" fill="#d8ed9c"/>
    <text x="271" y="84" font-size="12" letter-spacing="1">BETA</text>
    <text x="56" y="179" font-size="14" letter-spacing="3" fill="#66766e">IDEIAS ANTES DOS NOMES</text>
    <text x="56" y="244" font-size="53" font-weight="700" letter-spacing="-2">Propostas primeiro.</text>
    <text x="56" y="292" font-size="21" fill="#66766e">Conheça suas coincidências, com contexto.</text>
    <rect x="56" y="341" width="230" height="56" rx="11" fill="#173e36"/>
    <text x="82" y="376" font-size="18" font-weight="700" fill="#f6f7f2">Explorar as pautas →</text>
    <text x="56" y="442" font-size="14" fill="#66766e">Uma pergunta por vez. Fontes para conferir.</text>
  </g>
</svg>
